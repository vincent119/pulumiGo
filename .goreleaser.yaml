# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    - go generate ./...

builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.Version={{.Version}}
    goos:
      - linux
      - windows
      - darwin

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

brews:
  - name: pulumigo
    directory: Formula
    repository:
      owner: vincent119
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/vincent119/pulumiGo"
    description: "pulumiGo CLI tool"
    license: MIT

homebrew_casks:
  - name: pulumigo
    directory: Casks
    repository:
      owner: vincent119
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/vincent119/pulumiGo"
    description: "pulumiGo CLI tool"
    url:
      verified: github.com/vincent119/pulumiGo
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/pulumiGo"]
          end

scoops:
  - name: pulumiGo
    directory: bucket
    repository:
      owner: vincent119
      name: scoop-bucket
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/vincent119/pulumiGo"
    description: "A CLI wrapper for Pulumi infrastructure-as-code workflows, written in Go"
    license: MIT

changelog:
  use: github
  sort: desc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  header: |
    ## 本版本變更

    ### 修正
    - 修正 `pulumiGo up` 等子指令在 Pulumi 底層執行失敗時，Cobra 會額外輸出完整 `Usage:` 與 flags 的問題。
    - 新增 root command 測試，確保執行錯誤只回傳實際錯誤，不再混入 CLI 使用說明。

    ### 變更
    - README 新增 Windows Scoop 安裝說明，補齊跨平台安裝文件。

  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
